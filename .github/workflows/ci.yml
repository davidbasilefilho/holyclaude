name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate plugin and marketplace
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          # Claude Code is a locked devDependency, so a new release cannot turn the job red on its
          # own and the binary is integrity-checked; validation needs no credentials.
          bun run claude plugin validate --strict plugin
          bun run claude plugin validate --strict .

      - name: Format
        run: mise run fmt:readonly

      - name: Lint
        run: mise run lint:readonly

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test

      - name: Check bundle is current
        run: |
          mise run build
          # Porcelain output is non-empty when the bundle is modified, untracked or ignored.
          # The glob follows the bundle wherever the build task writes it under plugin/.
          status="$(git status --porcelain --ignored -- 'plugin/*/holyclaude.js')"
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::The committed bundle is stale. Run 'mise run build' and commit the bundle it writes under plugin/."
            exit 1
          fi
