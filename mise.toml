[tools]
bun = "1.4.3"

[tasks.fmt]
description = "Format the repository in place"
run = "bun run oxfmt --write"

[tasks."fmt:readonly"]
description = "Check formatting without writing"
run = "bun run oxfmt --check"

[tasks.lint]
description = "Lint the repository and apply fixes"
run = "bun run oxlint --fix"

[tasks."lint:readonly"]
description = "Lint the repository without fixing"
run = "bun run oxlint"

[tasks.typecheck]
description = "Type-check the repository"
# `--check` is Bun 1.4.3's built-in type check (older Bun prints help and exits 0); a bare `bun check` would run the `check` script.
run = "bun --check"

[tasks.test]
description = "Run the test suite"
run = "bun test"

[tasks.check]
description = "Run lint:readonly, fmt:readonly and typecheck"
run = [{ task = "lint:readonly" }, { task = "fmt:readonly" }, { task = "typecheck" }]

[tasks."check:fix"]
description = "Run lint, fmt and typecheck, writing fixes"
run = [{ task = "lint" }, { task = "fmt" }, { task = "typecheck" }]

[tasks.build]
description = "Bundle the CLI into plugin/scripts/holyclaude.js"
dir = "{{config_root}}/packages/cli"
run = "bun build src/main.ts --target bun --outfile ../../plugin/scripts/holyclaude.js"

[tasks."bump:minor"]
description = "Bump the minor version in the six version files and bun.lock, and reset patch and hotfix"
run = ["bun scripts/bump-version.ts minor", { task = "build" }]

[tasks."bump:patch"]
description = "Bump the patch version in the six version files and bun.lock, and reset hotfix"
run = ["bun scripts/bump-version.ts patch", { task = "build" }]

[tasks."bump:hotfix"]
description = "Bump the hotfix version in the six version files and bun.lock"
run = ["bun scripts/bump-version.ts hotfix", { task = "build" }]
