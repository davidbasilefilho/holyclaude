[tools]
bun = "1.4.3"

[tasks.fmt]
description = "Format the repository in place"
run = "bunx oxfmt --write"

[tasks."fmt:readonly"]
description = "Check formatting without writing"
run = "bunx oxfmt --check"

[tasks.lint]
description = "Lint the repository and apply fixes"
run = "bunx oxlint --fix"

[tasks."lint:readonly"]
description = "Lint the repository without fixing"
run = "bunx oxlint"

[tasks.typecheck]
description = "Type-check the repository"
run = "bun check"

[tasks.test]
description = "Run the test suite"
run = "bun test"

[tasks.build]
description = "Bundle the CLI into plugin/bin/holyclaude.js"
dir = "{{config_root}}/packages/cli"
run = "bun build src/main.ts --target bun --outfile ../../plugin/bin/holyclaude.js"

[tasks."bump:minor"]
description = "Bump the minor version in all six version files and reset patch and hotfix"
usage = 'arg "[root]" help "Repository root holding the six version files"'
run = ['bun scripts/bump-version.ts minor {{usage.root | default(value="")}}', { task = "build" }]

[tasks."bump:patch"]
description = "Bump the patch version in all six version files and reset hotfix"
usage = 'arg "[root]" help "Repository root holding the six version files"'
run = ['bun scripts/bump-version.ts patch {{usage.root | default(value="")}}', { task = "build" }]

[tasks."bump:hotfix"]
description = "Bump the hotfix version in all six version files"
usage = 'arg "[root]" help "Repository root holding the six version files"'
run = ['bun scripts/bump-version.ts hotfix {{usage.root | default(value="")}}', { task = "build" }]
